[tool.poetry]
name = "prenotazione-pdl"
version = "0.1.0"
description = "Versione rifattorizzata dell'automazione SafeWork per la prenotazione PDL."
authors = ["Giancarlo Allegretti"]
packages = [
    { include = "prenotazione_pdl", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
selenium = "^4.18.1"
openpyxl = ">=3.1.5"
tenacity = "^8.2.3"
pywin32 = { version = "*", platform = "win32" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.3.0"
mypy = "*"
xenon = "^0.9.3"
radon = "*"
interrogate = "^1.7.0"
bandit = "^1.7.7"
vulture = "^2.11"
refurb = "^2.0.0"
eradicate = "^2.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# ═══════════════════════════════════════════════════════════════
# Qualità del Codice - Configurazioni Speculari a ISAB_TimeSheet
# ═══════════════════════════════════════════════════════════════

[tool.xenon]
max-absolute = "B"
max-modules = "B"
max-average = "A"
exclude = "build,dist,tests,.venv"

[tool.radon]
cc_min = "B"
show_complexity = true
average = true
order = "SCORE"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".venv", ".git", "__pycache__", "build", "dist", "temp"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "SIM", "UP", "C4", "PERF", "FURB", "RUF", 
    "TCH", "PTH", "DTZ", "RET", "PIE", "T20", "LOG", "S", "ANN", "ERA", "N", "TRY", "PL", "C90"
]
ignore = [
    "E501", "RET504", "DTZ005", "T201", "S603", "S607", "S608", "RUF001", "ANN401"
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["prenotazione_pdl"]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "selenium.*",
    "openpyxl.*",
    "tenacity.*",
    "win32com.*",
    "win32client.*"
]
ignore_missing_imports = true

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-module = true
fail-under = 90
exclude = ["tests", "docs", "build", "dist"]
verbose = 1
quiet = false
color = true
